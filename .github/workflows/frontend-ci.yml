name: frontend-ci

on:
  push:
    branches: [dev, main]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    paths: ['frontend/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit -- --run
      - run: npm run build

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          cache-from: type=registry,ref=ghcr.io/pythonjsgo/afisha-frontend:buildcache
          cache-to: type=registry,ref=ghcr.io/pythonjsgo/afisha-frontend:buildcache,mode=max
          provenance: false
          # PUBLIC_API_URL is baked in at build time by Vite. Browser fetches
          # use it directly (so it must be a public URL, not docker network).
          # SvelteKit SSR also reads it; with the absolute URL the same image
          # works in node-adapter mode without ORIGIN gymnastics.
          build-args: |
            PUBLIC_API_URL=${{ github.ref == 'refs/heads/main' && 'https://afisha.vshage.app/api' || 'https://afisha.dev.vshage.app/api' }}
          tags: |
            ghcr.io/pythonjsgo/afisha-frontend:${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
            ghcr.io/pythonjsgo/afisha-frontend:${{ github.sha }}
